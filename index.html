<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Contact Book</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 0%, #e9efff 0, transparent 34rem),
        #f5f7fb;
    }

    button, input { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 14px;
      background: #4f63d8;
      color: white;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 8px 18px #4f63d833;
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: 22px; letter-spacing: -0.5px; }
    .subtitle { margin-top: 3px; color: #798397; font-size: 13px; }

    .summary {
      color: #657087;
      font-size: 14px;
    }

    .summary strong { color: #172033; font-size: 18px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 1px solid #e8ebf2;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 35px #26324a0a;
    }

    .list-panel { overflow: hidden; }
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 24px;
      border-bottom: 1px solid #edf0f5;
    }

    .list-header h2, .form-panel h2 { font-size: 16px; }

    .search {
      width: min(240px, 55%);
      padding: 10px 12px;
      border: 1px solid #e3e7ef;
      border-radius: 10px;
      outline: none;
      color: #172033;
      background: #fbfcfe;
    }

    .search:focus, .field input:focus {
      border-color: #7181e4;
      box-shadow: 0 0 0 3px #7181e41c;
    }

    #contact-list { padding: 0 24px; }

    .contact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 19px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .contact:last-child { border-bottom: 0; }

    .contact-main {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      background: #eef0ff;
      color: #4f63d8;
      font-weight: 700;
      text-transform: uppercase;
    }

    .contact-copy { min-width: 0; }
    .contact-name {
      overflow: hidden;
      color: #202a3e;
      font-size: 14px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contact-detail {
      overflow: hidden;
      margin-top: 5px;
      color: #778196;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contact-actions { display: flex; flex: 0 0 auto; gap: 7px; }

    .icon-button {
      padding: 7px 9px;
      border: 1px solid #e7eaf0;
      border-radius: 8px;
      background: white;
      color: #626e83;
      cursor: pointer;
      font-size: 12px;
    }

    .icon-button:hover { border-color: #cdd3e0; color: #28334a; }
    .icon-button.delete:hover { border-color: #f2c5c5; color: #bf3d3d; }

    .empty {
      padding: 52px 20px;
      color: #788398;
      text-align: center;
      font-size: 14px;
    }

    .form-panel { padding: 23px; }
    .form-intro { margin: 7px 0 21px; color: #7b8598; font-size: 13px; line-height: 1.5; }
    .field { display: block; margin-bottom: 15px; }
    .field span { display: block; margin-bottom: 7px; color: #465168; font-size: 12px; font-weight: 650; }

    .field input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #e3e7ef;
      border-radius: 9px;
      outline: none;
      color: #172033;
      background: #fff;
      font-size: 13px;
    }

    .field input::placeholder { color: #a4acba; }

    .form-actions { display: flex; gap: 9px; margin-top: 21px; }

    .primary, .secondary {
      padding: 11px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }

    .primary {
      flex: 1;
      border: 1px solid #4f63d8;
      background: #4f63d8;
      color: white;
    }

    .primary:hover { background: #4054c7; }
    .secondary { border: 1px solid #e3e7ef; background: white; color: #5e6a80; }
    .secondary[hidden] { display: none; }

    .notice {
      min-height: 20px;
      margin-top: 14px;
      color: #bd4141;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .page { width: min(100% - 28px, 620px); padding-top: 30px; }
      .layout { grid-template-columns: 1fr; }
      .form-panel { grid-row: 1; }
    }

    @media (max-width: 480px) {
      .page { width: calc(100% - 22px); }
      .topbar { align-items: flex-start; }
      .summary { text-align: right; }
      .list-header { align-items: flex-start; flex-direction: column; padding: 19px; }
      .search { width: 100%; }
      #contact-list { padding: 0 19px; }
      .contact { align-items: flex-start; }
      .contact-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">C</div>
        <div>
          <h1>Contact Book</h1>
          <p class="subtitle">Your people, organized.</p>
        </div>
      </div>
      <p class="summary"><strong id="contact-count">0</strong><br>contacts</p>
    </header>

    <div class="layout">
      <section class="panel list-panel" aria-labelledby="contacts-title">
        <div class="list-header">
          <h2 id="contacts-title">All contacts</h2>
          <input class="search" id="search" type="search" placeholder="Search contacts..." aria-label="Search contacts">
        </div>
        <div id="contact-list" aria-live="polite">
          <p class="empty">Loading contacts...</p>
        </div>
      </section>

      <section class="panel form-panel" aria-labelledby="form-title">
        <h2 id="form-title">Add a contact</h2>
        <p class="form-intro">Save the details you need to stay in touch.</p>
        <form id="contact-form">
          <label class="field">
            <span>Name *</span>
            <input name="name" autocomplete="name" placeholder="e.g. Alex Morgan" required maxlength="150">
          </label>
          <label class="field">
            <span>Mobile number</span>
            <input name="mobile" type="tel" autocomplete="tel" placeholder="e.g. +1 555 010 1234" maxlength="40">
          </label>
          <label class="field">
            <span>Email address</span>
            <input name="email" type="email" autocomplete="email" placeholder="e.g. alex@example.com" maxlength="254">
          </label>
          <label class="field">
            <span>Organization</span>
            <input name="organization" autocomplete="organization" placeholder="e.g. Acme Inc." maxlength="150">
          </label>
          <div class="form-actions">
            <button class="primary" id="submit-button" type="submit">Add contact</button>
            <button class="secondary" id="cancel-button" type="button" hidden>Cancel</button>
          </div>
          <p class="notice" id="notice" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("contact-form");
    const list = document.getElementById("contact-list");
    const count = document.getElementById("contact-count");
    const search = document.getElementById("search");
    const notice = document.getElementById("notice");
    const formTitle = document.getElementById("form-title");
    const submitButton = document.getElementById("submit-button");
    const cancelButton = document.getElementById("cancel-button");
    let contacts = [];
    let editingId = null;

    async function request(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.error || "Something went wrong. Please try again.");
      }
      return result;
    }

    function renderContacts() {
      const query = search.value.trim().toLowerCase();
      const visibleContacts = contacts.filter((contact) =>
        [contact.name, contact.mobile, contact.email, contact.organization]
          .some((value) => value.toLowerCase().includes(query))
      );

      count.textContent = contacts.length;
      list.replaceChildren();

      if (visibleContacts.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = contacts.length ? "No contacts match your search." : "No contacts yet. Add your first contact.";
        list.append(empty);
        return;
      }

      for (const contact of visibleContacts) {
        const item = document.createElement("article");
        item.className = "contact";

        const main = document.createElement("div");
        main.className = "contact-main";
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = contact.name.trim().charAt(0) || "?";

        const copy = document.createElement("div");
        copy.className = "contact-copy";
        const name = document.createElement("p");
        name.className = "contact-name";
        name.textContent = contact.name;
        const detail = document.createElement("p");
        detail.className = "contact-detail";
        detail.textContent = [contact.mobile, contact.email, contact.organization]
          .filter(Boolean).join(" · ") || "No additional details";
        copy.append(name, detail);
        main.append(avatar, copy);

        const actions = document.createElement("div");
        actions.className = "contact-actions";
        const edit = document.createElement("button");
        edit.className = "icon-button";
        edit.type = "button";
        edit.textContent = "Edit";
        edit.setAttribute("aria-label", `Edit ${contact.name}`);
        edit.addEventListener("click", () => beginEdit(contact));
        const remove = document.createElement("button");
        remove.className = "icon-button delete";
        remove.type = "button";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete ${contact.name}`);
        remove.addEventListener("click", () => deleteContact(contact));
        actions.append(edit, remove);
        item.append(main, actions);
        list.append(item);
      }
    }

    function beginEdit(contact) {
      editingId = contact.id;
      for (const field of ["name", "mobile", "email", "organization"]) {
        form.elements[field].value = contact[field];
      }
      formTitle.textContent = "Update contact";
      submitButton.textContent = "Save changes";
      cancelButton.hidden = false;
      notice.textContent = "";
      form.elements.name.focus();
    }

    function resetForm() {
      editingId = null;
      form.reset();
      formTitle.textContent = "Add a contact";
      submitButton.textContent = "Add contact";
      cancelButton.hidden = true;
      notice.textContent = "";
    }

    async function deleteContact(contact) {
      if (!window.confirm(`Delete ${contact.name} from your contacts?`)) return;
      notice.textContent = "";
      try {
        await request(`/api/contacts/${contact.id}`, { method: "DELETE" });
        if (editingId === contact.id) resetForm();
        await loadContacts();
      } catch (error) {
        notice.textContent = error.message;
      }
    }

    async function loadContacts() {
      contacts = await request("/api/contacts");
      renderContacts();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      notice.textContent = "";
      const contact = Object.fromEntries(new FormData(form).entries());
      const isEditing = editingId !== null;
      try {
        await request(isEditing ? `/api/contacts/${editingId}` : "/api/contacts", {
          method: isEditing ? "PUT" : "POST",
          body: JSON.stringify(contact)
        });
        resetForm();
        await loadContacts();
      } catch (error) {
        notice.textContent = error.message;
      }
    });

    cancelButton.addEventListener("click", resetForm);
    search.addEventListener("input", renderContacts);

    loadContacts().catch((error) => {
      list.replaceChildren();
      const message = document.createElement("p");
      message.className = "empty";
      message.textContent = error.message;
      list.append(message);
    });
  </script>
</body>
</html>
